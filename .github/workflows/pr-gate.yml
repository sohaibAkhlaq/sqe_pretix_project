name: SQE Pull Request Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  static-and-whitebox-gates:
    name: "Offline Quality Gates (Static, 100% Scoped Coverage, Real AST Mutation, OpenAPI, Supply Chain)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-test.txt"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: "Gate 1: Static Analysis & Complexity Audit on Scoped Production Module"
        run: |
          radon cc -s -a upstream/pretix/base/scoped_business_logic.py
          radon mi -s upstream/pretix/base/scoped_business_logic.py
          lizard -C 15 upstream/pretix/base/scoped_business_logic.py

      - name: "Gate 2: Scoped Production Unit Tests & 100% Statement/Branch Coverage Gate"
        run: |
          pytest tests/team/unit/ \
            -v \
            --cov=upstream.pretix.base.scoped_business_logic \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage/coverage.xml \
            --cov-fail-under=100

      - name: "Gate 3: Real AST Mutation Testing Quality Gate (Threshold >= 70%, 100% Killable)"
        run: |
          python scripts/run_mutation_tests.py

      - name: "Gate 4: OpenAPI 3.0 Contract & Deterministic Test Data Regeneration"
        run: |
          python scripts/verify_datagen_and_openapi.py --offline

      - name: "Gate 5: Supply Chain Vulnerability Audit (0 Known CVEs)"
        run: |
          python -m pip_audit -r requirements-test.txt

  live-compose-integration-gates:
    name: "Live Container Integration Gates (API, E2E, Accessibility, Security, Master Audit)"
    needs: static-and-whitebox-gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 & Playwright Chromium
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-test.txt"

      - name: Install Dependencies & Chromium
        run: |
          pip install -r requirements-test.txt
          playwright install chromium

      - name: Provision Ephemeral Secrets & Start Pretix Compose Stack
        run: |
          cat <<EOF > .env
          PRETIX_DJANGO_SECRET=$(openssl rand -hex 24)
          PRETIX_DATABASE_PASSWORD=$(openssl rand -hex 16)
          SQE_ADMIN_PASSWORD=$(openssl rand -hex 16)
          SQE_AUDITOR_PASSWORD=$(openssl rand -hex 16)
          AUTOMIGRATE=yes
          EOF
          docker compose up -d
          ready=0
          for i in $(seq 1 60); do
            if curl -fsSL http://localhost:8345/control/login/ >/dev/null 2>&1; then
              echo "Pretix web service ready."
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            docker compose logs --tail=60 pretix
            exit 1
          fi
          docker cp scripts/seed_internal.py pretix_web:/data/seed_internal.py
          docker exec pretix_web python3 /data/seed_internal.py
          docker cp scripts/patch_a11y_container.py pretix_web:/tmp/patch_a11y_container.py
          docker exec pretix_web python3 /tmp/patch_a11y_container.py
          docker restart pretix_web
          ready_after=0
          for i in $(seq 1 40); do
            if curl -fsSL http://localhost:8345/control/login/ >/dev/null 2>&1; then
              echo "Pretix web service ready after durable A11y template patch."
              ready_after=1
              break
            fi
            sleep 3
          done
          if [ "$ready_after" -ne 1 ]; then
            docker compose logs --tail=60 pretix
            exit 1
          fi

      - name: "Gate 6a: Live REST API Integration Suite"
        run: python scripts/run_api_tests.py

      - name: "Gate 6b: Playwright E2E UI Automation Suite"
        run: python scripts/run_e2e_tests.py

      - name: "Gate 6c: Usability, Accessibility & Lighthouse Audit"
        run: |
          python scripts/run_a11y_tests.py
          python scripts/run_lighthouse_axe_audit.py

      - name: "Gate 6d: Defensive Security, RBAC Matrix, pip-audit & Passive Scan"
        run: |
          python scripts/run_security_tests.py
          python scripts/run_owasp_zap_audit.py

      - name: Diagnostics on Failure
        if: failure()
        run: |
          docker compose logs --tail=50 pretix || true
          cat reports/e2e/e2e_test_results.json || true

      - name: "Gate 7: Grand Master Audit & Integrity Verification"
        run: |
          python scripts/verify_grand_master_audit.py
          python scripts/verify_ai_use_record.py

      - name: Tear Down Compose Stack
        if: always()
        run: docker compose down -v
