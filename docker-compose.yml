services:
  pretix:
    image: pretix/standalone:stable
    container_name: pretix_web
    restart: unless-stopped
    ports:
      - "8345:80"
    environment:
      - PRETIX_INSTANCE_NAME=SE3002 SQE Pretix Lab
      - PRETIX_CURRENCY=EUR
      - PRETIX_URL=http://localhost:8345
      - PRETIX_TRUST_X_FORWARDED_FOR=on
      - PRETIX_TRUST_X_FORWARDED_PROTO=on
      - PRETIX_DJANGO_SECRET=se3002-gold-medalist-secret-key-pretix-testing-2026
      - PRETIX_DATABASE_BACKEND=postgresql
      - PRETIX_DATABASE_NAME=pretix
      - PRETIX_DATABASE_USER=pretix
      - PRETIX_DATABASE_PASSWORD=pretix_secure_pass_2026
      - PRETIX_DATABASE_HOST=postgres
      - PRETIX_DATABASE_PORT=5432
      - PRETIX_REDIS_LOCATION=redis://redis:6379/0
      - PRETIX_REDIS_SESSIONS=true
      - PRETIX_CELERY_BACKEND=redis://redis:6379/1
      - PRETIX_CELERY_BROKER=redis://redis:6379/2
      - PRETIX_MAIL_FROM=tickets@localhost
      - PRETIX_MAIL_HOST=localhost
      - PRETIX_MAIL_PORT=25
      - PRETIX_MAIL_TLS=off
      - NUM_WORKERS=2
      - CELERY_WORKER_CONCURRENCY=1
      - AUTOMIGRATE=skip
    volumes:
      - pretix_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pretix_net

  postgres:
    image: postgres:16-alpine
    container_name: pretix_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pretix
      POSTGRES_USER: pretix
      POSTGRES_PASSWORD: pretix_secure_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pretix -d pretix"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pretix_net

  redis:
    image: redis:7-alpine
    container_name: pretix_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pretix_net

volumes:
  pretix_data:
  postgres_data:
  redis_data:

networks:
  pretix_net:
    driver: bridge
